[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "koschei-sentinel"
version = "0.9.0"
description = "AI-native cybersecurity defense intelligence, training, evaluation, and active-defense platform for Koschei"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Koschei" }]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110,<2",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.5,<1",
]
neon = [
  "psycopg[binary]>=3.2,<4",
]
training = [
  "accelerate",
  "bitsandbytes",
  "datasets",
  "peft",
  "torch",
  "transformers",
]

[project.scripts]
koschei-sentinel = "koschei_sentinel.__main__:main"
sentinel-dataset-export = "koschei_sentinel.dataset_cli:main"
sentinel-dataset-split = "koschei_sentinel.split_cli:main"
sentinel-dataset-build = "koschei_sentinel.dataset_build_cli:main"
sentinel-dataset-readiness = "koschei_sentinel.readiness_cli:main"
sentinel-neon-build = "koschei_sentinel.neon_cli:main"
sentinel-eval = "koschei_sentinel.eval_cli:main"
sentinel-compare = "koschei_sentinel.matrix_cli:main"
sentinel-train = "koschei_sentinel.train_cli:main"
sentinel-autotrain = "koschei_sentinel.autotrain_cli:main"
sentinel-pretrain-audit = "koschei_sentinel.pretraining_corpus_cli:main"
sentinel-blockchain-corpus-audit = "koschei_sentinel.blockchain_security_corpus_cli:main"
sentinel-cyber-catalog-audit = "koschei_sentinel.cyber_corpus_catalog_cli:main"
sentinel-cyber-artifact-audit = "koschei_sentinel.cyber_artifact_audit_cli:main"
sentinel-cyber-extract = "koschei_sentinel.cyber_source_extractors_cli:main"
sentinel-cyber-materialize = "koschei_sentinel.cyber_snapshot_materializer_cli:main"
sentinel-cyber-batch-seal = "koschei_sentinel.cyber_collection_batch_cli:main"
sentinel-cyber-perceive = "koschei_sentinel.cyber_perception_cli:main"
sentinel-active-defense-plan = "koschei_sentinel.active_defense_cli:main"
sentinel-cyber-range = "koschei_sentinel.cyber_range_cli:main"
sentinel-world-model-episode = "koschei_sentinel.cyber_world_model_episode_cli:main"
sentinel-defense-reflex-mine = "koschei_sentinel.defense_reflex_candidates_cli:main"
sentinel-defense-reflex-review = "koschei_sentinel.defense_reflex_review_cli:main"
sentinel-defense-reflex-build = "koschei_sentinel.defense_reflex_corpus_cli:main"
sentinel-causal-defense-build = "koschei_sentinel.causal_defense_corpus_cli:main"
sentinel-cyber-training-bundle = "koschei_sentinel.cyber_training_bundle_cli:main"
sentinel-register-candidate = "koschei_sentinel.incubation_registry_cli:main"
sentinel-job-plan = "koschei_sentinel.offline_job_cli:main"
sentinel-job-receipt = "koschei_sentinel.offline_receipt_cli:main"
sentinel-finalize-candidate = "koschei_sentinel.candidate_finalization_cli:main"
sentinel-promotion = "koschei_sentinel.promotion_cli:main"
sentinel-shadow-plan = "koschei_sentinel.shadow_replay_cli:main"
sentinel-shadow-receipt = "koschei_sentinel.shadow_receipt_cli:main"
sentinel-shadow-review = "koschei_sentinel.shadow_review_cli:main"
sentinel-shadow-regression = "koschei_sentinel.shadow_regression_cli:main"
sentinel-shadow-baseline = "koschei_sentinel.shadow_baseline_cli:main"
sentinel-owner-rotation = "koschei_sentinel.owner_rotation_cli:main"
sentinel-curriculum-check = "koschei_sentinel.curriculum_cli:main"
sentinel-language-foundation = "koschei_sentinel.language_foundation_cli:main"
sentinel-language-train = "koschei_sentinel.language_training_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koschei_sentinel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
