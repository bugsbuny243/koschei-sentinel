[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "koschei-sentinel"
version = "0.9.0"
description = "AI-native cybersecurity defense intelligence, training, evaluation, and active-defense platform for Koschei"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Koschei" }]
dependencies = [
  "cryptography>=42",
  "fastapi>=0.110,<2",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff==0.16.6",
]
neon = [
  "psycopg[binary]>=3.2,<4",
]
training = [
  "accelerate",
  "bitsandbytes",
  "datasets",
  "huggingface-hub",
  "peft",
  "torch",
  "transformers>=5.12,<6",
]
megatron = [
  "ms-swift==4.5.2",
]
holdout = [
  "ms-swift==4.5.2",
  "vllm==0.17.0",
  "ray[cgraph]",
]

[project.scripts]
sentinel-bundle-check = "koschei_sentinel.commercial_bundle_v1:main"
koschei-sentinel = "koschei_sentinel.__main__:main"
sentinel-cloud-runtime-preflight = "koschei_sentinel.cloud_runtime_cli:main"
sentinel-dataset-export = "koschei_sentinel.dataset_cli:main"
sentinel-dataset-split = "koschei_sentinel.split_cli:main"
sentinel-dataset-build = "koschei_sentinel.dataset_build_cli:main"
sentinel-dataset-readiness = "koschei_sentinel.readiness_cli:main"
sentinel-neon-build = "koschei_sentinel.neon_cli:main"
sentinel-eval = "koschei_sentinel.eval_cli:main"
sentinel-compare = "koschei_sentinel.matrix_cli:main"
sentinel-train = "koschei_sentinel.train_cli:main"
sentinel-cyber-sft = "koschei_sentinel.cyber_sft_cli:main"
sentinel-cyber-sft-verify = "koschei_sentinel.cyber_sft_artifact_verify_cli:main"
sentinel-cyber-sft-attest = "koschei_sentinel.cyber_sft_run_attestation_cli:main"
sentinel-cyber-sft-export = "koschei_sentinel.cyber_sft_export_cli:main"
sentinel-cyber-sft-export-verify = "koschei_sentinel.cyber_sft_export_verify_cli:main"
sentinel-cyber-sft-scale-gate = "koschei_sentinel.cyber_sft_scale_gate_cli:main"
