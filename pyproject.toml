[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "koschei-sentinel"
version = "0.1.1"
description = "Evidence-grounded Web3 security model platform for Koschei"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Koschei" }]
dependencies = [
  "fastapi>=0.110,<2",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.5,<1",
]

[project.scripts]
koschei-sentinel = "koschei_sentinel.__main__:main"
sentinel-dataset-export = "koschei_sentinel.dataset_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/koschei_sentinel"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
