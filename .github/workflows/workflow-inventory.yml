name: Temporary CI workflow inventory
on:
  pull_request:
    paths:
      - ".github/workflows/workflow-inventory.yml"
permissions:
  contents: read
jobs:
  list-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: List workflows for dependency-gate repair
        run: find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort
