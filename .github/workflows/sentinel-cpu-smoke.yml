name: Sentinel CPU Distributed Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest torch
      - name: Compile recovery modules
        run: |
          python -m py_compile src/koschei_sentinel/production_mcore_recovery_checkpoint_manager.py
          python -m py_compile src/koschei_sentinel/production_mcore_checkpoint_retention.py
      - name: Run recovery checkpoint contract tests
        run: pytest -q tests/test_production_mcore_async_checkpoint_contract.py
