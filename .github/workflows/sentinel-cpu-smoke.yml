name: Sentinel CPU Distributed Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest torch
      - name: Compile recovery modules
        run: |
          python -m py_compile src/koschei_sentinel/production_mcore_recovery_checkpoint_manager.py
          python -m py_compile src/koschei_sentinel/production_mcore_checkpoint_retention.py
      - name: Run recovery checkpoint contract tests
        run: pytest -q tests/test_production_mcore_async_checkpoint_contract.py
      - name: Run real two-process Gloo agreement smoke
        shell: bash
        run: |
          cat > /tmp/sentinel_gloo_smoke.py <<'PY'
          import os
          import tempfile
          from pathlib import Path
          import torch.distributed as dist
          import torch.multiprocessing as mp
          from koschei_sentinel.production_mcore_async_checkpoint import AsyncCheckpointConfig
          from koschei_sentinel.production_mcore_checkpoint_retention import RecoveryCheckpointEntry, RecoveryCheckpointIndex
          from koschei_sentinel.production_mcore_recovery_checkpoint_manager import RecoveryCheckpointManager

          def worker(rank, world_size, init_file, root):
              dist.init_process_group("gloo", init_method=f"file://{init_file}", rank=rank, world_size=world_size)
              try:
                  manager = object.__new__(RecoveryCheckpointManager)
                  manager.root = Path(root).resolve()
                  manager.keep_recovery_slots = 2
                  manager.pending = {}
                  manager.index = RecoveryCheckpointIndex(keep_recovery_slots=2, entries=[])
                  entry = RecoveryCheckpointEntry(
                      global_step=1,
                      commit_generation=99 + rank,
                      checkpoint_dir=(Path(root) / "checkpoint-1").as_posix(),
                      kind="recovery",
                      durable=False,
                  )
                  agreed = manager._agree_entry(entry)
                  assert agreed.commit_generation == 0
                  assert agreed.global_step == 1
                  assert agreed.checkpoint_dir.endswith("checkpoint-1")
              finally:
                  dist.destroy_process_group()

          if __name__ == "__main__":
              with tempfile.TemporaryDirectory() as td:
                  init_file = os.path.join(td, "dist-init")
                  mp.spawn(worker, args=(2, init_file, td), nprocs=2, join=True)
          PY
          python /tmp/sentinel_gloo_smoke.py
