name: Sentinel lint contract-review proposal (read-only)

on:
  pull_request:
    paths:
      - ".github/workflows/lint-autofix-proposal.yml"

permissions:
  contents: read

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.6
      - name: Compute safe fixes without pushing code
        run: |
          ruff check --output-format json . > /tmp/sentinel-ruff-diagnostics.json || true
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          diagnostics = json.loads(Path("/tmp/sentinel-ruff-diagnostics.json").read_text())
          explanations = {
              "TRY004": "preserve ValueError validation/manifest API contract",
              "BLE001": "intentional broad exception at external error boundary",
          }
          grouped = defaultdict(list)
          for entry in diagnostics:
              code = entry["code"]
              if code in explanations:
                  grouped[entry["filename"]].append((entry["location"]["row"], code))
          for filename, issues in grouped.items():
              path = Path(filename)
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              for row, code in issues:
                  original = lines[row - 1]
                  assert "# noqa" not in original, (path, row)
                  ending = "\\n" if original.endswith("\\n") else ""
                  lines[row - 1] = (
                      original.rstrip("\\r\\n") +
                      f"  # noqa: {code} - {explanations[code]}" + ending
                  )
              path.write_text("".join(lines), encoding="utf-8")
          print(f"LINT_CONTRACT_EXCEPTIONS:{sum(len(v) for v in grouped.values())}")
          PY
          python - <<'PY'
          import base64
          import json
          import pathlib
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "-z"], text=True
          ).split("\0")
          changed = [path for path in changed if path]
          print(f"LINT_AUTOFIX_COUNT:{len(changed)}")
          for path in changed:
              content = pathlib.Path(path).read_text(encoding="utf-8")
              raw = base64.b64encode(content.encode("utf-8")).decode("ascii")
              width = 3500
              chunks = [raw[i:i + width] for i in range(0, len(raw), width)]
              for index, chunk in enumerate(chunks):
                  print(
                      "LINT_AUTOFIX_CHUNK:"
                      + json.dumps(
                          {
                              "path": path,
                              "index": index,
                              "count": len(chunks),
                              "chunk": chunk,
                          },
                          separators=(",", ":"),
                      ),
                      flush=True,
                  )
          print("LINT_AUTOFIX_END")
          PY
