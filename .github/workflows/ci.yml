name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Gold HOLDOUT fail-closed regression gate
        run: >-
          pytest -q
          tests/test_cyber_sft_artifact_verify.py
          tests/test_cyber_sft_candidate_snapshot.py
          tests/test_cyber_sft_export.py
          tests/test_cyber_sft_export_cli.py
          tests/test_cyber_sft_export_paths.py
          tests/test_cyber_sft_export_verify.py
          tests/test_cyber_sft_export_count_binding.py
          tests/test_cyber_sft_export_promotion_binding.py
          tests/test_cyber_sft_execution_preflight.py
          tests/test_cyber_sft_execution_cli_preflight.py
          tests/test_cyber_sft_trainer_explicit_validation.py
          tests/test_defense_reflex_gold_review.py
          tests/test_defense_reflex_gold_capacity.py
          tests/test_defense_reflex_gold_production_release.py
          tests/test_gold_review_signing.py
          tests/test_gold_reviewer_trust.py
          tests/test_gold_reviewer_trust_cli.py
          tests/test_gold_review_cli_contracts.py
          tests/test_gold_release_snapshot.py
          tests/test_gold_candidate_training_binding.py
          tests/test_gold_holdout_candidate_export_gate.py
          tests/test_gold_holdout_inference_runner.py
          tests/test_gold_holdout_inference_runner_cli.py
          tests/test_gold_holdout_prompt_preflight.py
          tests/test_gold_holdout_inference_verify.py
          tests/test_gold_holdout_inference_verify_cli.py
          tests/test_gold_holdout_output_snapshot.py
          tests/test_gold_holdout_pack_preflight.py
          tests/test_gold_holdout_pack_admission.py
          tests/test_gold_holdout_snapshot_consumers.py
          tests/test_gold_holdout_pack_signing.py
          tests/test_gold_holdout_path_portability.py
          tests/test_gold_holdout_evaluation.py
          tests/test_gold_holdout_evaluation_cli.py
          tests/test_gold_holdout_signed_export_snapshot.py
          tests/test_gold_holdout_evaluation_evidence.py
          tests/test_gold_holdout_evaluation_evidence_cli.py
          tests/test_gold_holdout_evidence_snapshot.py
          tests/test_gold_holdout_signed_evidence.py
          tests/test_cyber_megatron_candidate.py
          tests/test_cyber_megatron_holdout.py
          tests/test_cyber_megatron_holdout_worker.py
          tests/test_cyber_megatron_gold_evidence.py
          tests/test_cyber_defense_promotion_v5.py
          tests/test_cyber_defense_promotion_v5_sources.py
          tests/test_cyber_defense_promotion.py
          tests/test_cyber_defense_promotion_gold_case_count.py
          tests/test_cyber_defense_promotion_cli.py
          tests/test_gold_holdout_promotion_e2e.py
          tests/test_gold_holdout_promotion_relocation.py
      - name: Web4 review operator fail-closed gate
        run: pytest tests/test_web4_review_ops_cli.py
      - name: Validate Web4 review operator entrypoint
        run: sentinel-web4-review-ops --help
      - name: Web4 HOLDOUT operator fail-closed gate
        run: pytest tests/test_web4_holdout_ops_cli.py
      - name: Validate Web4 HOLDOUT operator entrypoint
        run: sentinel-web4-holdout-ops --help
      - name: Web4 HOLDOUT capacity fail-closed gate
        run: pytest tests/test_web4_holdout_capacity.py
      - name: Validate Web4 HOLDOUT capacity entrypoint
        run: sentinel-web4-holdout-capacity --help
      - name: Web4 signed review fail-closed gate
        run: pytest tests/test_web4_benchmark_review.py
      - name: Web4 signed HOLDOUT release fail-closed gate
        run: pytest tests/test_web4_holdout_release.py
      - name: Web4 offline HOLDOUT evaluation fail-closed gate
        run: pytest tests/test_web4_holdout_evaluation.py
      - name: Web4 owner evaluation decision fail-closed gate
        run: pytest tests/test_web4_holdout_evaluation_decision.py
      - name: Validate Web4 review verifier entrypoint
        run: sentinel-web4-review-verify --help
      - name: Validate Web4 HOLDOUT release verifier entrypoint
        run: sentinel-web4-holdout-release-verify --help
      - name: Validate Web4 HOLDOUT evaluation verifier entrypoint
        run: sentinel-web4-holdout-eval-verify --help
      - name: Validate Web4 evaluation decision verifier entrypoint
        run: sentinel-web4-holdout-eval-decision-verify --help
      - run: sentinel-web4-research-readiness
      - name: Web4 Agent Trust Chain fail-closed gate
        run: pytest tests/test_web4_agent_trust_chain.py
      - name: Validate Web4 Agent Trust Chain contract
        run: sentinel-web4-agent-trust-chain
      - name: Web4 Agent Trust authoring plan fail-closed gate
        run: pytest tests/test_web4_agent_trust_authoring.py
      - name: Validate Web4 Agent Trust authoring plan
        run: sentinel-web4-agent-trust-authoring
      - name: Web4 research snapshot receipt fail-closed gate
        run: pytest tests/test_web4_research_snapshot.py
      - name: Validate Web4 research snapshot capture and verify
        run: |
          mkdir -p build/web4
          sentinel-web4-research-snapshot capture \
            --source-id ietf.draft.nemethi.aid-agent-identity-discovery-00 \
            --snapshot fixtures/web4/research-snapshot/fixture-source.txt \
            --captured-at 2026-09-07T10:57:00+03:00 \
            --output build/web4/research-snapshot-receipt.json
          sentinel-web4-research-snapshot verify \
            --receipt build/web4/research-snapshot-receipt.json \
            --snapshot fixtures/web4/research-snapshot/fixture-source.txt
      - name: PQ research ingestion fail-closed gate
        run: pytest tests/test_pq_network_intelligence.py
      - name: Validate PQ research ingestion capture and materialization
        run: |
          mkdir -p build/pq
          sentinel-pq-network-intelligence capture \
            --source-id ethereum-protocol-priorities-2026-02-18 \
            --snapshot fixtures/pq/research-snapshot/synthetic-source.txt \
            --captured-at 2026-09-09T02:05:00+03:00 \
            --output build/pq/snapshot-receipt.json
          sentinel-pq-network-intelligence verify-snapshot \
            --receipt build/pq/snapshot-receipt.json \
            --snapshot fixtures/pq/research-snapshot/synthetic-source.txt
          sentinel-pq-network-intelligence materialize \
            --claim fixtures/pq/research-snapshot/synthetic-claim.json \
            --snapshot-receipt build/pq/snapshot-receipt.json \
            --snapshot fixtures/pq/research-snapshot/synthetic-source.txt \
            --output build/pq/record.json \
            --receipt-output build/pq/materialization-receipt.json
          sentinel-pq-network-intelligence verify-materialization \
            --claim fixtures/pq/research-snapshot/synthetic-claim.json \
            --snapshot-receipt build/pq/snapshot-receipt.json \
            --snapshot fixtures/pq/research-snapshot/synthetic-source.txt \
            --record build/pq/record.json \
            --receipt build/pq/materialization-receipt.json
      - name: Web4 benchmark snapshot receipt binding gate
        run: pytest tests/test_web4_benchmark_snapshot_receipt_binding.py
      - name: Validate Web4 benchmark intake isolation
        run: >-
          sentinel-web4-benchmark-intake
          --proposal fixtures/web4/benchmark-intake/proposal.json
          --answer-key fixtures/web4/benchmark-intake/answer-key.json
          --output build/web4/benchmark-intake.json
      - name: Web4 batch benchmark intake fail-closed gate
        run: pytest tests/test_web4_benchmark_batch_queue.py
      - name: Validate Web4 batch benchmark intake entrypoint
        run: sentinel-web4-benchmark-batch-intake --help
      - run: >-
          sentinel-curriculum-check
          --config configs/curriculum/language-first.v1.json
      - run: >-
          sentinel-dataset-readiness
          --release fixtures/training/release
          --policy fixtures/readiness/policy.fixture.json
      - name: Validate private dataset build without materializing
        env:
          SENTINEL_DATASET_SALT: ci-fixture-salt-never-use-in-production
        run: >-
          sentinel-dataset-build
          --input fixtures/arvis.source.safe.json
          --salt-version ci-fixture-v1
          --policy fixtures/readiness/policy.fixture.json
          --dry-run
      - run: >-
          sentinel-eval
          --suite fixtures/evals/suite.safe.jsonl
          --candidate sentinel-baseline-v0.4
          --output build/evals/baseline.json
      - run: >-
          sentinel-compare
          --suite fixtures/evals/suite.safe.jsonl
          --registry fixtures/models/candidates.safe.json
          --output-dir build/comparisons/safe
          --require-all
      - run: >-
          sentinel-compare
          --suite fixtures/evals/suite.safe.jsonl
          --registry fixtures/models/candidates.together.low-cost.json
          --plan-only
      - run: >-
          sentinel-train
          --config fixtures/training/config.safe.json
          --plan-output build/training/fixture.plan.json
