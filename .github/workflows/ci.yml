name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Generate Ruff baseline cleanup
        run: |
          ruff format src tests
          ruff check src tests --fix --exit-zero
          mkdir -p build/ruff-baseline
          git diff --name-only -z -- src tests > build/ruff-baseline/files.zlist
          if [ -s build/ruff-baseline/files.zlist ]; then
            tar --null -T build/ruff-baseline/files.zlist -czf build/ruff-baseline/modified-files.tgz
          else
            tar -czf build/ruff-baseline/modified-files.tgz --files-from /dev/null
          fi
          git diff -- src tests > build/ruff-baseline/changes.patch
          ruff check src tests --output-format=json > build/ruff-baseline/remaining.json || true
      - name: Upload Ruff baseline cleanup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ruff-baseline-cleanup
          path: build/ruff-baseline
          if-no-files-found: error
          retention-days: 1
      - run: ruff check .
      - run: pytest
      - run: >-
          sentinel-curriculum-check
          --config configs/curriculum/language-first.v1.json
      - run: >-
          sentinel-dataset-readiness
          --release fixtures/training/release
          --policy fixtures/readiness/policy.fixture.json
      - name: Validate private dataset build without materializing
        env:
          SENTINEL_DATASET_SALT: ci-fixture-salt-never-use-in-production
        run: >-
          sentinel-dataset-build
          --input fixtures/arvis.source.safe.json
          --salt-version ci-fixture-v1
          --policy fixtures/readiness/policy.fixture.json
          --dry-run
      - run: >-
          sentinel-eval
          --suite fixtures/evals/suite.safe.jsonl
          --candidate sentinel-baseline-v0.4
          --output build/evals/baseline.json
      - run: >-
          sentinel-compare
          --suite fixtures/evals/suite.safe.jsonl
          --registry fixtures/models/candidates.safe.json
          --output-dir build/comparisons/safe
          --require-all
      - run: >-
          sentinel-compare
          --suite fixtures/evals/suite.safe.jsonl
          --registry fixtures/models/candidates.together.low-cost.json
          --plan-only
      - run: >-
          sentinel-train
          --config fixtures/training/config.safe.json
          --plan-output build/training/fixture.plan.json
