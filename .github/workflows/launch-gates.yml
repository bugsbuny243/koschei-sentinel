name: launch-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: launch-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Launch readiness fail-closed tests
        run: pytest -q tests/test_launch_readiness.py
      - name: Signed full-release fail-closed tests
        run: pytest -q tests/test_full_release.py
      - name: Validate launch readiness CLI
        run: python -m koschei_sentinel.launch_readiness_cli --help
      - name: Validate full-release CLI
        run: python -m koschei_sentinel.full_release_cli --help
      - name: Static checks for release contracts
        run: ruff check src/koschei_sentinel/launch_readiness.py src/koschei_sentinel/full_release.py src/koschei_sentinel/full_release_cli.py tests/test_launch_readiness.py tests/test_full_release.py
