name: Fabric Campaign Contract

on:
  pull_request:
    paths:
      - "src/koschei_sentinel/fabric_campaign_contract.py"
      - "tests/test_fabric_campaign_contract.py"
      - ".github/workflows/fabric-campaign-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/koschei_sentinel/fabric_campaign_contract.py"
      - "tests/test_fabric_campaign_contract.py"
      - ".github/workflows/fabric-campaign-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Prove observe-only campaign opinion contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src/koschei_sentinel/fabric_campaign_contract.py tests/test_fabric_campaign_contract.py
      - name: Contract tests
        run: pytest -q tests/test_fabric_campaign_contract.py
