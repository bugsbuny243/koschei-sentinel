name: pq-evidence-review

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pq-evidence-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pq-evidence-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Ruff PQ evidence review
        run: >-
          ruff check
          src/koschei_sentinel/pq_evidence_review.py
          src/koschei_sentinel/pq_evidence_review_cli.py
          tests/test_pq_evidence_review.py
          tests/test_pq_evidence_review_cli.py
      - name: PQ evidence review fail-closed gate
        run: >-
          pytest -q
          tests/test_pq_evidence_review.py
          tests/test_pq_evidence_review_cli.py
      - name: Validate PQ evidence review CLI module
        run: python -m koschei_sentinel.pq_evidence_review_cli --help
