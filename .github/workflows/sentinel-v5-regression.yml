name: Sentinel V5 regression

on:
  pull_request:
    paths:
      - "src/koschei_sentinel/attack_progression.py"
      - "src/koschei_sentinel/defense_authority.py"
      - "src/koschei_sentinel/defense_connector_contract.py"
      - "src/koschei_sentinel/assured_defense_connector.py"
      - "src/koschei_sentinel/assured_active_defense.py"
      - "src/koschei_sentinel/interception_planner.py"
      - "src/koschei_sentinel/perception_adapter_profiles.py"
      - "src/koschei_sentinel/perception_adapter_cli.py"
      - "src/koschei_sentinel/service.py"
      - "src/koschei_sentinel/request_body_limit.py"
      - "tests/test_active_defense_five_layers_and_api.py"
      - "tests/test_defense_connector_contract.py"
      - "tests/test_assured_defense_connector.py"
      - ".github/workflows/sentinel-v5-regression.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Run Sentinel V5 focused pytest
        run: >-
          pytest tests/test_active_defense_five_layers_and_api.py
          tests/test_defense_connector_contract.py
          tests/test_assured_defense_connector.py
      - name: Run standard-dependency suite excluding three PyTorch-only test modules
        run: >-
          pytest
          --ignore=tests/test_production_mcore_recovery_gloo_smoke.py
          --ignore=tests/test_production_checkpoint_manifest.py
          --ignore=tests/test_production_mcore_async_checkpoint_contract.py
      - name: Lint changed Sentinel V5 Python files
        if: always()
        run: >-
          ruff check
          src/koschei_sentinel/attack_progression.py
          src/koschei_sentinel/defense_authority.py
          src/koschei_sentinel/defense_connector_contract.py
          src/koschei_sentinel/assured_defense_connector.py
          src/koschei_sentinel/assured_active_defense.py
          src/koschei_sentinel/interception_planner.py
          src/koschei_sentinel/perception_adapter_profiles.py
          src/koschei_sentinel/perception_adapter_cli.py
          src/koschei_sentinel/service.py
          src/koschei_sentinel/request_body_limit.py
          tests/test_active_defense_five_layers_and_api.py
          tests/test_defense_connector_contract.py
          tests/test_assured_defense_connector.py
